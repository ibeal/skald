[package]
name = "skald"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "skald"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
# `preserve_order` keeps a ticket's frontmatter key order in `--json`, so machine output reads in the
# same order as the file a human edits.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.23"
uuid = { version = "1.18", features = ["v4"] }
# `created`/`updated` are dates a human reads, so they have to be *local* dates. Computing one from
# `SystemTime` alone gives UTC, which is a day off every evening west of Greenwich — a log entry dated
# tomorrow is worse than a dependency.
jiff = "0.2.35"
