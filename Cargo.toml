[package]
name = "skald"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "skald"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
# `preserve_order` keeps a ticket's frontmatter key order in `--json`, so machine output reads in the
# same order as the file a human edits.
serde_json = { version = "1.0.145", features = ["preserve_order"] }
